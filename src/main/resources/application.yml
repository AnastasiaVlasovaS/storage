spring:
  application:
    name: storage

  # Настройки базы данных (выберите один из вариантов)
  datasource:
    # === Вариант 1: H2 (in-memory, подходит для разработки) ===
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: vlasova
    password: balbes
    # === Вариант 2: PostgreSQL (раскомментируйте и закомментируйте H2) ===
    # url: jdbc:postgresql://localhost:5432/storage_db
    # driver-class-name: org.postgresql.Driver
    # username: your_username
    # password: your_password

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect  # для PostgreSQL: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop   # в продакшене используйте validate или none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  # H2 Console (только для H2)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Настройки загрузки файлов (multipart)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
      file-size-threshold: 2KB

  # === Security & OAuth2 Client (Google) ===
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID      # замените на реальный
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# Серверные настройки
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m

# Кастомная директория для хранения загруженных файлов (можно переопределить через переменную окружения)
storage:
  dir: ./uploads

# Логирование
logging:
  level:
    root: INFO
    com.example.cloud.storage: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Настройки CORS (если не управляются через WebConfig)
# cors:
#   allowed-origins: http://localhost:8081, http://localhost:3000